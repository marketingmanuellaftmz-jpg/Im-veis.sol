<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Imóveis · Carteira de Leads</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F5;
    --surface:#FFFFFF;
    --ink:#1B2B29;
    --ink-soft:#5D6B68;
    --ink-faint:#8B9794;
    --accent:#1F6F5C;
    --accent-soft:#E3EFEC;
    --gold:#B8842E;
    --gold-soft:#F5EBDA;
    --brick:#A54A3A;
    --brick-soft:#F3E4E0;
    --line:#DFE4E2;
    --shadow: 0 1px 2px rgba(27,43,41,0.04), 0 4px 16px rgba(27,43,41,0.05);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px 100px;}

  /* Header */
  header.top{
    padding:56px 28px 36px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#EEF3F1 0%, var(--bg) 100%);
  }
  .top-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,4.5vw,52px);
    line-height:1.05;
    margin:0;
    letter-spacing:-0.01em;
  }
  .count-badge{
    text-align:right;
  }
  .count-badge .num{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:56px;
    line-height:1;
    color:var(--accent);
  }
  .count-badge .lbl{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* Bairro index strip — signature element */
  .index-strip{
    max-width:1180px;margin:26px auto 0;
    display:flex;flex-wrap:wrap;gap:0;
    border-top:1px solid var(--line);
  }
  .index-item{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:10px 14px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .index-item:hover{background:var(--accent-soft);color:var(--accent);}
  .index-item b{color:var(--ink);font-weight:600;}
  .index-item:hover b{color:var(--accent);}

  /* Controls */
  .controls{
    position:sticky;top:0;z-index:20;
    background:rgba(244,246,245,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 28px;
  }
  .controls-inner{max-width:1180px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .search-box{
    flex:1 1 240px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:var(--surface);
    color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .search-box::before{
    content:"⌕";
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    color:var(--ink-faint);font-size:16px;
  }
  select, .btn{
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    cursor:pointer;
  }
  select:focus, .btn:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{font-weight:600;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#195949;}
  .btn.ghost:hover{background:var(--accent-soft);}
  .stat-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:10px 28px 0;
    max-width:1180px;margin:0 auto;
  }

  /* Bairro sections */
  .bairro-section{margin-top:44px;}
  .bairro-head{
    display:flex;align-items:baseline;gap:12px;
    border-bottom:2px solid var(--ink);
    padding-bottom:8px;margin-bottom:18px;
  }
  .bairro-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0;
  }
  .bairro-head .bairro-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;
  }

  /* Card */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 16px 14px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:10px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-id{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .card-id b{color:var(--ink-soft);}
  .tipo-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .tipo-venda{background:var(--accent-soft);color:var(--accent);}
  .tipo-locacao{background:var(--gold-soft);color:var(--gold);}
  .tipo-ambos{background:#EAE7F5;color:#5A4E9E;}

  .endereco{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:500;
    line-height:1.3;
    margin:0;
  }

  .status-row select{
    width:100%;
    font-weight:600;
    font-size:12.5px;
    padding:7px 10px;
  }
  .status-disponivel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .status-negociando{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);}
  .status-vendido{background:var(--brick-soft);color:var(--brick);border-color:var(--brick);}

  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:4px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 9px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
    background:#FBFBFA;
    resize:vertical;
  }
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;min-width:0;}
  .field textarea{min-height:48px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:0;background:#fff;}

  .fotos-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .foto-thumb{position:relative;width:44px;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .foto-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .foto-thumb button{
    position:absolute;top:0;right:0;background:rgba(27,43,41,.75);color:#fff;border:none;
    width:16px;height:16px;font-size:10px;line-height:16px;cursor:pointer;border-radius:0 0 0 6px;
  }
  .foto-add{
    width:44px;height:44px;border-radius:6px;border:1px dashed var(--ink-faint);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
    cursor:pointer;font-size:18px;background:#FBFBFA;
  }
  .foto-add:hover{border-color:var(--accent);color:var(--accent);}
  .foto-add input{display:none;}

  .empty{
    text-align:center;padding:80px 20px;color:var(--ink-soft);
    font-family:'Fraunces',serif;font-size:18px;
  }

  footer{
    max-width:1180px;margin:60px auto 0;padding:20px 28px 0;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }

  @media (max-width:640px){
    .top-inner{align-items:flex-start;}
    .count-badge{text-align:left;}
    .controls-inner{gap:8px;}
  }

  /* Item adicionado manualmente */
  .custom-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .remove-btn{
    background:none;border:none;cursor:pointer;
    color:var(--ink-faint);font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    padding:0;text-decoration:underline;
  }
  .remove-btn:hover{color:var(--brick);}

  .owners-list{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .owner-block{
    padding:10px;border:1px solid var(--line);border-radius:8px;background:#FBFBFA;
    display:flex;flex-direction:column;gap:6px;
  }
  .owner-block .field-row{gap:8px;}
  .owner-remove-btn{align-self:flex-start;}
  .owner-add-btn{width:100%;}

  /* Modal adicionar imóvel */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(27,43,41,0.45);
    display:none;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:12px;
    max-width:440px;width:100%;
    padding:26px 26px 22px;
    box-shadow:0 12px 40px rgba(27,43,41,0.25);
    max-height:88vh;overflow-y:auto;
  }
  .modal h3{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:22px;margin:0 0 18px;
  }
  .modal .field{margin-bottom:14px;}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:10px;margin-top:18px;
  }

  /* Abas principais */
  .main-tabs{
    max-width:1180px;margin:0 auto;padding:22px 28px 0;
    display:flex;gap:6px;
  }
  .main-tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 18px;border:1px solid var(--line);border-bottom:none;
    border-radius:8px 8px 0 0;background:var(--surface);color:var(--ink-soft);
    cursor:pointer;
  }
  .main-tab.active{color:var(--accent);background:var(--bg);border-color:var(--line);position:relative;}
  .main-tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* Bloco de notas */
  .notes-wrap{
    max-width:1180px;margin:0 auto;padding:0 28px 100px;
    display:grid;grid-template-columns:260px 1fr;gap:20px;
  }
  .notes-list{
    border-right:1px solid var(--line);
    padding-right:16px;
    display:flex;flex-direction:column;gap:6px;
    max-height:70vh;overflow-y:auto;
  }
  .notes-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .notes-list-head h3{
    font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0;
  }
  .note-item{
    padding:10px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;
  }
  .note-item:hover{background:var(--surface);}
  .note-item.active{background:var(--accent-soft);border-color:var(--accent);}
  .note-item .n-title{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
    color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .note-item .n-date{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);
  }
  .notes-empty{
    font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-faint);padding:8px 10px;
  }
  .note-editor{display:flex;flex-direction:column;gap:10px;}
  .note-editor textarea{
    width:100%;min-height:52vh;
    border:1px solid var(--line);border-radius:10px;
    padding:16px;background:var(--surface);
    font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.6;color:var(--ink);
    resize:vertical;
  }
  .note-editor textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
  .note-editor-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .note-status{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);
  }
  @media (max-width:720px){
    .notes-wrap{grid-template-columns:1fr;}
    .notes-list{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:12px;max-height:220px;}
  }

  /* ---- Detalhes ampliados do imóvel ---- */
  .details-block{
    border-top:1px dashed var(--line);
    padding-top:10px;
    margin-top:2px;
    display:flex;flex-direction:column;gap:12px;
  }
  .details-section-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);
    margin:2px 0 0;
  }
  .info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .info-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .info-grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:420px){
    .info-grid.cols-4{grid-template-columns:repeat(2,1fr);}
  }
  .chips-wrap{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:5px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#FBFBFA;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
    transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.on{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
    font-weight:600;
  }
  .maps-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .maps-row .field{flex:1;min-width:180px;}
  .maps-link-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;font-weight:600;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--accent);
    padding:8px 12px;border-radius:6px;
    white-space:nowrap;
  }
  .maps-link-btn:hover{background:var(--accent-soft);}
  .maps-embed{
    width:100%;height:180px;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;
  }
  .maps-embed iframe{width:100%;height:100%;border:0;display:block;}

  .details-toggle{
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--accent);
    cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .details-toggle:hover{background:var(--accent-soft);}
  .details-toggle .chev{transition:transform .15s ease;}
  .details-toggle.open .chev{transform:rotate(180deg);}
  .details-block{display:none;}
  .details-block.open{display:flex;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <p class="eyebrow">Carteira privada de imóveis</p>
      <h1>Meus Imóveis</h1>
    </div>
    <div class="count-badge">
      <div class="num" id="totalCount">71</div>
      <div class="lbl">imóveis na carteira</div>
    </div>
  </div>
  <nav class="index-strip" id="indexStrip" aria-label="Índice de bairros"></nav>
</header>

<nav class="main-tabs">
  <button class="main-tab active" id="tabImoveisBtn">Imóveis</button>
  <button class="main-tab" id="tabNotasBtn">Bloco de notas</button>
</nav>

<div class="tab-panel active" id="panelImoveis">

<div class="controls">
  <div class="controls-inner">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por endereço, código JH, bairro ou contato...">
    </div>
    <select id="filterBairro"><option value="">Todos os bairros</option></select>
    <select id="filterTipo">
      <option value="">Venda ou locação</option>
      <option value="Venda">Venda</option>
      <option value="Locação">Locação</option>
      <option value="Venda e Locação">Venda e Locação</option>
    </select>
    <select id="filterStatus">
      <option value="">Todos os status</option>
      <option value="disponivel">Disponível</option>
      <option value="negociando">Negociando</option>
      <option value="vendido">Vendido/Alugado</option>
    </select>
    <button class="btn primary" id="addBtn">+ Adicionar imóvel</button>
    <button class="btn ghost" id="exportBtn" title="Baixar backup em JSON">Exportar backup</button>
    <label class="btn ghost" style="margin:0;">
      Importar backup
      <input type="file" id="importInput" accept="application/json" style="display:none;">
    </label>
  </div>
</div>

<p class="stat-line" id="statLine"></p>

<div class="wrap">
  <div id="results"></div>
</div>

</div>

<div class="tab-panel" id="panelNotas">
  <div class="notes-wrap">
    <div class="notes-list" id="notesList">
      <div class="notes-list-head">
        <h3>Suas notas</h3>
        <button class="btn ghost" id="newNoteBtn" style="padding:6px 10px;font-size:12px;">+ Nova</button>
      </div>
      <div id="notesListItems"></div>
    </div>
    <div class="note-editor">
      <textarea id="noteContent" placeholder="Escreva aqui suas ideias, lembretes, planos de negociação..."></textarea>
      <div class="note-editor-actions">
        <button class="btn primary" id="saveNoteBtn">Salvar como novo arquivo</button>
        <button class="btn ghost" id="updateNoteBtn">Salvar alterações</button>
        <button class="btn ghost" id="downloadNoteBtn">Baixar .txt</button>
        <button class="btn ghost" id="deleteNoteBtn">Excluir</button>
        <span class="note-status" id="noteStatus"></span>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Adicionar imóvel</h3>
    <form id="addForm">
      <div class="field">
        <label>Bairro</label>
        <input type="text" id="newBairro" list="bairroList" placeholder="Ex: Perdizes" required>
        <datalist id="bairroList"></datalist>
      </div>
      <div class="field">
        <label>Endereço</label>
        <input type="text" id="newEndereco" placeholder="Rua, número, unidade..." required>
      </div>
      <div class="field">
        <label>Código JH (opcional)</label>
        <input type="text" id="newCodigo" placeholder="Ex: JH1234">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="newTipo">
          <option value="Venda">Venda</option>
          <option value="Locação">Locação</option>
          <option value="Venda e Locação">Venda e Locação</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Nome do proprietário</label>
          <input type="text" id="newNome" placeholder="Nome">
        </div>
        <div class="field">
          <label>Telefone</label>
          <input type="text" id="newTelefone" placeholder="(11) 90000-0000">
        </div>
      </div>
      <div class="field">
        <label>Data da visita</label>
        <input type="date" id="newVisita">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelAdd">Cancelar</button>
        <button type="submit" class="btn primary">Adicionar imóvel</button>
      </div>
    </form>
  </div>
</div>

<footer>
  <span>Dados salvos automaticamente neste navegador.</span>
  <span>Faça backup (Exportar) sempre que atualizar muitos imóveis.</span>
</footer>

<script>
/* ---------- Dados base (fixos) ---------- */
const IMOVEIS = [
  {n:4, cod:"JH3116", bairro:"Água Branca", end:"R Clélia, 2145 - Und. 41", tipo:"Venda"},

/* ---------- Estado editável (persistido no localStorage) ---------- */
const STORAGE_KEY = "carteira_imoveis_v1";
const CUSTOM_KEY = "carteira_imoveis_custom_v1";

let storageAvisoMostrado = false;
function safeStorageSet(key, value){
  try{
    localStorage.setItem(key, value);
    return true;
  }catch(e){
    if(!storageAvisoMostrado){
      storageAvisoMostrado = true;
      alert('Este navegador está bloqueando o salvamento automático (comum em navegadores dentro de apps como Instagram/WhatsApp, ou no modo anônimo). O que você adicionar vai continuar funcionando nesta visita, mas não vai ficar salvo ao fechar a página. Abra o arquivo direto no Chrome ou Safari para salvar normalmente.');
    }
    return false;
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  safeStorageSet(STORAGE_KEY, JSON.stringify(state));
}
let state = loadState();

function loadCustom(){
  try{
    const raw = localStorage.getItem(CUSTOM_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}
function saveCustom(){

function getEntry(key){
  if(!state[key]){
    state[key] = {status:"disponivel", nome:"", telefone:"", dataVisita:"", obs:"", fotos:[]};
  }
  // migração: versões antigas usavam um único campo "contato"
  if(state[key].contato !== undefined && !state[key].nome && !state[key].telefone){
    state[key].nome = state[key].contato;
    state[key].telefone = "";
  }
  if(state[key].nome === undefined) state[key].nome = "";
  if(state[key].telefone === undefined) state[key].telefone = "";
  if(state[key].dataVisita === undefined) state[key].dataVisita = "";
  // migração: versões antigas usavam nome/telefone/telefone2 únicos -> lista de proprietários
  if(state[key].proprietarios === undefined){
    const props = [];
    if(state[key].nome || state[key].telefone){
      props.push({nome: state[key].nome || "", telefone: state[key].telefone || ""});
    }
    if(state[key].telefone2){
      props.push({nome: "", telefone: state[key].telefone2});
    }
    state[key].proprietarios = props;
  }
  // migração: adiciona campos de detalhes ampliados se ainda não existirem
  const blank = blankDetails();
  Object.keys(blank).forEach(k=>{
    if(state[key][k] === undefined) state[key][k] = blank[k];
  });
  return state[key];
}

function rebuildBairroUI(){
  const bairros = getBairros();
  const bairrosSugestao = [...new Set([...bairros, ...BAIRROS_SUGERIDOS_SP])].sort((a,b)=>a.localeCompare(b,'pt-BR'));

  // index strip
  const indexStrip = document.getElementById('indexStrip');
  indexStrip.innerHTML = '';
  bairros.forEach(b=>{
    const count = allItems().filter(i=>i.bairro===b).length;
    const el = document.createElement('div');
    el.className = 'index-item';
    el.innerHTML = `${b} <b>${count}</b>`;
    el.addEventListener('click', ()=>{
      const target = document.getElementById('sec-'+slug(b));
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
    indexStrip.appendChild(el);
  });

  // filtro bairro select (preserva seleção atual se ainda existir)
  const filterBairro = document.getElementById('filterBairro');
  const current = filterBairro.value;
  filterBairro.innerHTML = '<option value="">Todos os bairros</option>';
  bairros.forEach(b=>{
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    filterBairro.appendChild(opt);
  });
  if(bairros.includes(current)) filterBairro.value = current;

  // datalist do formulário de adicionar
  const bairroList = document.getElementById('bairroList');
  bairroList.innerHTML = '';
  bairrosSugestao.forEach(b=>{
    const opt = document.createElement('option');
    opt.value = b;
    bairroList.appendChild(opt);
  });
}

function slug(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
}

function tipoClass(tipo){
  if(tipo==="Venda") return "tipo-venda";
  if(tipo==="Locação") return "tipo-locacao";
  return "tipo-ambos";
}
function statusClass(status){
  return "status-"+status;
}
function statusLabel(status){
  return {disponivel:"Disponível", negociando:"Negociando", vendido:"Vendido/Alugado"}[status] || status;
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

const resultsEl = document.getElementById('results');

function currentFilters(){
  return {
    q: document.getElementById('searchInput').value.trim().toLowerCase(),
    bairro: document.getElementById('filterBairro').value,
    tipo: document.getElementById('filterTipo').value,
    status: document.getElementById('filterStatus').value,
  };
}

function matches(item, f){
  const entry = getEntry(item.key);
  if(f.bairro && item.bairro !== f.bairro) return false;
  if(f.tipo && item.tipo !== f.tipo) return false;
  if(f.status && entry.status !== f.status) return false;
  if(f.q){
    const proprietariosStr = entry.proprietarios.map(p=>`${p.nome} ${p.telefone}`).join(' ');
    const hay = `${item.end} ${item.cod||''} ${item.bairro} ${proprietariosStr} ${entry.obs} ${item.n||''}`.toLowerCase();
    if(!hay.includes(f.q)) return false;
  }
  return true;
}

function render(){
  const f = currentFilters();
  resultsEl.innerHTML = '';
  let shown = 0;
  const items = allItems();

  getBairros().forEach(bairro=>{
    const bairroItems = items.filter(i=>i.bairro===bairro && matches(i,f));
    if(bairroItems.length === 0) return;
    shown += bairroItems.length;

    const section = document.createElement('section');
    section.className = 'bairro-section';
    section.id = 'sec-' + slug(bairro);

    const head = document.createElement('div');
    head.className = 'bairro-head';
    head.innerHTML = `<h2>${bairro}</h2><span class="bairro-count">${bairroItems.length} ${bairroItems.length===1?'imóvel':'imóveis'}</span>`;
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'grid';
    bairroItems.sort((a,b)=>(a.n||9999)-(b.n||9999)).forEach(item=> grid.appendChild(renderCard(item)));
    section.appendChild(grid);

    resultsEl.appendChild(section);
  });

  if(shown === 0){
    resultsEl.innerHTML = '<div class="empty">Nenhum imóvel encontrado com esses filtros.</div>';
  }
  document.getElementById('totalCount').textContent = items.length;
  updateStatLine(shown);
}

function updateStatLine(shownCount){
  const items = allItems();
  const total = items.length;
  const disp = items.filter(i=>getEntry(i.key).status==='disponivel').length;
  const neg = items.filter(i=>getEntry(i.key).status==='negociando').length;
  const vend = items.filter(i=>getEntry(i.key).status==='vendido').length;
  const shown = shownCount !== undefined ? shownCount : items.filter(i=>matches(i,currentFilters())).length;
  document.getElementById('statLine').textContent =
    `Mostrando ${shown} de ${total} · Disponíveis: ${disp} · Negociando: ${neg} · Vendidos/Alugados: ${vend}`;
}

['searchInput'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
});
['filterBairro','filterTipo','filterStatus'].forEach(id=>{
  document.getElementById(id).addEventListener('change', render);
});

document.getElementById('exportBtn').addEventListener('click', ()=>{

document.getElementById('importInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];

  const reader = new FileReader();

      state = imported;

      render();
      alert('Backup importado com sucesso.');
    }catch(err){
      alert('Não foi possível ler esse arquivo. Verifique se é um backup exportado por este site.');

/* ---------- Bloco de notas ---------- */
const NOTES_KEY = "carteira_imoveis_notas_v1";

function loadNotes(){
  try{
    const raw = localStorage.getItem(NOTES_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}
function saveNotes(){
  safeStorageSet(NOTES_KEY, JSON.stringify(notes));
}
let notes = loadNotes();
let currentNoteId = null;

function noteTitle(note){
  const firstLine = (note.content || '').split('\n')[0].trim();
  return firstLine ? firstLine.slice(0,40) : 'Nota sem título';
}
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

const notesListItems = document.getElementById('notesListItems');
const noteContent = document.getElementById('noteContent');
const noteStatus = document.getElementById('noteStatus');

function renderNotesList(){
  notesListItems.innerHTML = '';
  if(notes.length === 0){
    notesListItems.innerHTML = '<div class="notes-empty">Nenhuma nota salva ainda.</div>';
    return;
  }
  [...notes].sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(note=>{
    const el = document.createElement('div');
    el.className = 'note-item' + (note.id === currentNoteId ? ' active' : '');
    el.innerHTML = `<div class="n-title">${escapeHtml(noteTitle(note))}</div><div class="n-date">${formatDate(note.updatedAt)}</div>`;
    el.addEventListener('click', ()=> openNote(note.id));
    notesListItems.appendChild(el);
  });
}

function openNote(id){
  const note = notes.find(n=>n.id===id);
  if(!note) return;
  currentNoteId = id;
  noteContent.value = note.content;
  noteStatus.textContent = 'Editando: ' + noteTitle(note);
  renderNotesList();
}

function newNoteDraft(){
  currentNoteId = null;
  noteContent.value = '';
  noteStatus.textContent = 'Nova nota (ainda não salva)';
  renderNotesList();
  noteContent.focus();
}

document.getElementById('newNoteBtn').addEventListener('click', newNoteDraft);

document.getElementById('saveNoteBtn').addEventListener('click', ()=>{
  const content = noteContent.value;
  if(!content.trim()){ noteStatus.textContent = 'Escreva algo antes de salvar.'; return; }
  const note = {
    id: 'note-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
    content: content,
    updatedAt: new Date().toISOString()
  };
  notes.push(note);
  saveNotes();
  currentNoteId = note.id;
  noteStatus.textContent = 'Salvo como novo arquivo: ' + noteTitle(note);
  renderNotesList();
});

document.getElementById('updateNoteBtn').addEventListener('click', ()=>{
  if(!currentNoteId){ noteStatus.textContent = 'Nenhuma nota aberta para atualizar — use "Salvar como novo arquivo".'; return; }
  const note = notes.find(n=>n.id===currentNoteId);
  if(!note) return;
  note.content = noteContent.value;
  note.updatedAt = new Date().toISOString();
  saveNotes();
  noteStatus.textContent = 'Alterações salvas: ' + noteTitle(note);
  renderNotesList();
});

document.getElementById('deleteNoteBtn').addEventListener('click', ()=>{
  if(!currentNoteId){ noteStatus.textContent = 'Nenhuma nota aberta para excluir.'; return; }
  if(!confirm('Excluir esta nota?')) return;
  notes = notes.filter(n=>n.id!==currentNoteId);
  saveNotes();
  newNoteDraft();
});

document.getElementById('downloadNoteBtn').addEventListener('click', ()=>{
  const content = noteContent.value;
  if(!content.trim()){ noteStatus.textContent = 'Escreva algo antes de baixar.'; return; }
  const title = currentNoteId
    ? noteTitle(notes.find(n=>n.id===currentNoteId) || {content})
    : noteTitle({content});
  const safeTitle = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40);
  const blob = new Blob([content], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nota-${safeTitle || 'sem-titulo'}-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
});

renderNotesList();

/* ---------- Inicialização ---------- */
rebuildBairroUI();
render();
</script>
</body>
